name: Publish Windows portable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.1.4
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: portable-release-${{ inputs.tag || 'v1.1.4' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || 'v1.1.4' }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - name: Verify release version
        run: |
          [xml]$project = Get-Content AppTimeTracker/AppTimeTracker.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'The tag must match the project version.'
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run core regression tests
        run: |
          dotnet run --project tests/AppTimeTracker.Regression/AppTimeTracker.Regression.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
      - name: Build portable package
        run: |
          dotnet publish AppTimeTracker/AppTimeTracker.csproj -c Release -p:PublishProfile=Portable
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          $folder = "artifacts/AppTimeTracker-$env:RELEASE_VERSION-portable"
          foreach ($file in @('AppTimeTracker.exe', 'e_sqlite3.dll', 'coreclr.dll')) {
            if (!(Test-Path "$folder/$file")) { throw "Missing portable file: $file" }
          }
          Copy-Item CHANGELOG.md "$folder/CHANGELOG.md"
          @"
          AppTimeTracker $env:RELEASE_VERSION · Windows x64 免安装版
          自带 .NET 10 桌面运行环境。请完整解压文件夹后运行 AppTimeTracker.exe。
          从旧版本升级前，请先在托盘选择“退出并保存”。
          "@ | Set-Content "$folder/使用说明.txt" -Encoding utf8BOM
          Compress-Archive -Path $folder -DestinationPath "$folder.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "$folder.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AppTimeTracker-$env:RELEASE_VERSION-portable.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          $zip = "artifacts/AppTimeTracker-$env:RELEASE_VERSION-portable.zip"
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = $changelog -split '(?m)^## ' | Select-Object -Skip 1 -First 1
          $notes = "## $section`n下载 portable.zip，完整解压后运行 AppTimeTracker.exe。`nSHA-256 见 SHA256SUMS.txt。"
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          gh release view $env:RELEASE_TAG --json url
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip artifacts/SHA256SUMS.txt
          } else {
            gh release create $env:RELEASE_TAG $zip artifacts/SHA256SUMS.txt --verify-tag --title "AppTimeTracker $env:RELEASE_VERSION" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
